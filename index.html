<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>LandLens – Find the Right Land</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>:root{--ink:#1d1c1a;--char:#2b2926;--paper:#f6f2ea;--sand:#e8dfcd;--gold:#b8975a;--muted:#7a746a;--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 Manrope,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,h3,h4,.logo,.price,.stats b{font-family:Fraunces,serif;font-weight:600;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1}h2{font-size:2rem}a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 24px}.sec{padding:64px 24px}.narrow{max-width:760px}.muted{color:var(--muted)}
.nav{position:sticky;top:0;z-index:10;background:rgba(29,28,26,.94);backdrop-filter:blur(8px);color:var(--paper)}
.navin{display:flex;justify-content:space-between;align-items:center;height:68px}.logo{font-size:1.5rem}
nav{display:flex;gap:24px;align-items:center}nav a:not(.btn){opacity:.8;transition:.2s}nav a:not(.btn):hover{opacity:1;color:var(--gold)}
.burger{display:none;background:none;border:0;color:inherit;font-size:1.5rem}
.btn{display:block;text-align:center;border:0;border-radius:999px;padding:13px 24px;font:700 .95rem Manrope;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px)}.gold{background:var(--gold);color:var(--ink)}.dark{background:var(--ink);color:var(--paper)}.wa{background:#25a55a;color:#fff}.sm{padding:9px 18px}
.hero{background:var(--ink);color:var(--paper);padding:110px 0 90px}.hero p{max-width:520px;opacity:.75;font-size:1.1rem}
.search{display:flex;gap:16px;align-items:end;background:var(--char);padding:20px;border-radius:var(--r);margin-top:36px;animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.search .btn{white-space:nowrap}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;flex:1}
.field{display:flex;flex-direction:column;font-size:.8rem;gap:6px;color:var(--muted)}.hero .field{color:#bdb5a6}
select,input,textarea{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid #d9cfba;background:#fff;color:var(--ink);width:100%}
select:focus,input:focus,textarea:focus,.card:focus,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:28px;margin-top:28px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.thumb{position:relative;aspect-ratio:3/2;overflow:hidden}.photo{width:100%;height:100%;display:block;transition:transform .6s}.card:hover .photo{transform:scale(1.05)}
.tag{position:absolute;top:14px;left:14px;background:var(--paper);padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700}.tag.sold{background:var(--ink);color:#fff}
.card-body{padding:20px}.card h3{font-size:1.2rem}.card p{margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;align-items:center}.row strong{font-size:1.1rem;color:#8a6d36}
.band{background:var(--sand)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:56px 24px;text-align:center}
.stats b{display:block;font-size:2.8rem;color:var(--char)}.stats span{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin-top:24px}
.step{background:#fff;padding:24px;border-radius:var(--r)}.step span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold);font-weight:700;margin-bottom:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px}.bar select{width:auto}
.link{background:none;border:0;color:#8a6d36;font:inherit;cursor:pointer;margin-right:14px}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:420px;margin:20px 0;border-radius:var(--r);overflow:hidden}
.gallery>div:first-child{grid-row:span 2}.gallery .photo{height:100%}
.detail{display:grid;grid-template-columns:1fr 360px;gap:48px}
dl{margin:24px 0}dl div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--sand)}dt{color:var(--muted)}dd{margin:0}
.side{align-self:start;position:sticky;top:90px;background:#fff;padding:28px;border-radius:var(--r);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.price{font-size:2.2rem}
.form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.notice{background:var(--sand);padding:18px 22px;border-radius:var(--r);margin-top:20px}
.loc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-top:28px}
.locbox{background:#fff;padding:26px;border-radius:var(--r)}.locbox small{color:var(--muted);font-weight:400;font-family:Manrope}.locbox>div{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:1px solid var(--sand);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.85rem;transition:.2s}.chip:hover{background:var(--gold)}
footer{background:var(--ink);color:#bdb5a6;padding:28px 0;font-size:.9rem}
@media(max-width:900px){.detail{grid-template-columns:1fr}.side{position:static}.search{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}
.burger{display:block}nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--ink);flex-direction:column;padding:20px;align-items:flex-start}nav.open{display:flex}.gallery{height:260px}.gallery>div:nth-child(n+2){display:none}.gallery{grid-template-columns:1fr}dl div{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.loc-btn{display:block;margin-top:14px;text-align:center;border:1px solid var(--gold);border-radius:999px;padding:8px;font-size:.85rem;font-weight:700;color:#8a6d36;transition:.2s}.loc-btn:hover{background:var(--gold);color:var(--ink)}
.line{border:1px solid var(--ink);color:var(--ink)}.line:hover{background:var(--ink);color:var(--paper)}
.mapbox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sand);border-radius:var(--r);padding:20px 24px}.mapbox p{margin:0}.mapbtns{display:flex;gap:10px}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.nav{top:env(safe-area-inset-top,0px)}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React
// Mock data (all names, numbers and contacts are fictional).
// Row: [id,title,state,city,area,sqft,dims,type,priceLakh,availability,hue,year,road,vastu,history,landmarks,owner,phone]
const rows = [
[1,'Corner Plot near ITPL','Karnataka','Bengaluru','Whitefield',2400,'30 x 80 ft','Residential',420,'Available',38,2024,'40 ft tarred road, east-facing corner','East-facing, open NE corner, ideal for a main entrance','Layout approved by BBMP in 2019; single owner since purchase.',['Phoenix Marketcity 3 km','Whitefield Metro 2 km','ITPL 4 km'],'Ravi Menon (Owner)','+91 90000 10001'],
[2,'Mango Farm Acre','Karnataka','Bengaluru','Devanahalli',43560,'Approx. 200 x 218 ft','Farmland',180,'Available',95,2024,'Mud road off State Highway, 1.2 km','North-facing; water source in the north-east','Inherited family farm with mango trees, clear agricultural title.',['Kempegowda Airport 12 km','Nandi Hills 30 km'],'Lakshmi Gowda (Owner)','+91 90000 10002'],
[3,'Pine View Hill Plot','Uttarakhand','Nainital','Mukteshwar',10890,'Approx. 90 x 121 ft','Hill / Eco-stay',95,'Available',150,2025,'Motorable road up to the plot','South-sloping, sunrise view from the east','Used earlier as an apple orchard; terraced and stable.',['Mukteshwar Temple 2 km','Chauli Ki Jali 3 km'],'Himanshu Bisht (Broker)','+91 90000 10003'],
[4,'Ganga Valley Plot','Uttarakhand','Rishikesh','Tapovan',5400,'60 x 90 ft','Residential',160,'Under Negotiation',170,2023,'20 ft road, 400 m from main market','North-east facing, fresh breeze from the valley','Part of a 1990s approved colony, ideal for a retreat or cafe.',['Laxman Jhula 2 km','Yoga Ashram Row 500 m'],'Neha Rawat (Broker)','+91 90000 10004'],
[5,'Lonavala Weekend Farm','Maharashtra','Pune','Lonavala',21780,'Approx. 150 x 145 ft','Farmland',240,'Available',120,2025,'Paved lane, 300 m from Old Highway','East-facing gate, water body to the north','Held by one family for 30 years; dam-view site.',['Tungarli Lake 3 km','Bhushi Dam 6 km'],'Sanjay Kulkarni (Owner)','+91 90000 10005'],
[6,'Commercial Plot Hinjewadi Phase 2','Maharashtra','Pune','Hinjewadi',4500,'50 x 90 ft','Commercial',520,'Available',210,2025,'60 ft main road frontage','North-facing, suits a corporate entrance','Zoned commercial in 2021; clear title.',['Rajiv Gandhi IT Park 1 km','Wakad 4 km'],'Anita Joshi (Broker)','+91 90000 10006'],
[7,'Alibaug Coastal Plot','Maharashtra','Raigad','Alibaug',8000,'80 x 100 ft','Residential',310,'Available',190,2024,'Black-top road, 900 m from beach','West sea view; keep NE corner open','Former coconut grove; plot cleared for building.',['Kihim Beach 900 m','Alibaug Jetty 12 km'],'Farhan Shaikh (Owner)','+91 90000 10007'],
[8,'Sector 150 Premium Plot','Delhi NCR','Noida','Sector 150',1800,'30 x 60 ft','Residential',210,'Available',60,2025,'Sector road 45 m wide','North-east facing, good fit for Vastu plan','Authority allotment, converted to freehold in 2022.',['Sports City 1 km','Noida Expressway 2 km'],'Pooja Malhotra (Broker)','+91 90000 10008'],
[9,'Sohna Road Commercial Land','Delhi NCR','Gurugram','Sohna Road',6000,'60 x 100 ft','Commercial',780,'Under Negotiation',30,2023,'Direct frontage on Sohna Road','North-facing; entrance on road side','Corner site; earlier a small showroom.',['Vatika Chowk 2 km','Gurugram Metro 5 km'],'Karan Bhalla (Owner)','+91 90000 10009'],
[10,'Tonk Road Residential Plot','Rajasthan','Jaipur','Tonk Road',2700,'30 x 90 ft','Residential',78,'Available',20,2024,'30 ft road with street lighting','East-facing; slight slope to the north-east','Part of a JDA-approved colony since 2017.',['Jaipur Airport 8 km','Durgapura Station 6 km'],'Mahesh Sharma (Owner)','+91 90000 10010'],
[11,'Pushkar Desert-Edge Farm','Rajasthan','Ajmer','Pushkar',32670,'Approx. 180 x 181 ft','Farmland',120,'Available',45,2025,'Link road to NH 58, 800 m','North-east borewell, east-facing entry','Used for rose farming; tube-well in place.',['Brahma Temple 7 km','Pushkar Lake 8 km'],'Gopal Choudhary (Owner)','+91 90000 10011'],
[12,'Hebbal Layout Corner','Karnataka','Mysuru','Hebbal',1200,'30 x 40 ft','Residential',85,'Sold',75,2022,'30 ft road on two sides','North and east open, corner plot','Recently sold; shown for demo only.',['Infosys Campus 3 km','Mysuru Palace 8 km'],'Suma Rao (Owner)','+91 90000 10012'],
[13,'Modipuram Expressway Plot','Delhi NCR','Meerut','Modipuram',3600,'40 x 90 ft','Residential',95,'Available',110,2025,'Close to Meerut-Delhi Expressway','East-facing, regular rectangular shape','Approved colony; ready for construction.',['Expressway Entry 3 km','Meerut Cantt 6 km'],'Vikas Tyagi (Broker)','+91 90000 10013']]
const properties = rows.map(([id,title,state,city,area,sqft,dims,type,price,avail,hue,year,road,vastu,history,landmarks,owner,phone]) => ({
  id,title,state,city,area,sqft,dims,type,price,avail,hue,year,road,vastu,history,landmarks,owner,phone,
  desc:`A ${type.toLowerCase()} property in ${area}, ${city}. ${sqft.toLocaleString('en-IN')} sq ft with clear access and nearby essentials.`}))
const fmtPrice = l => l >= 100 ? `₹${(l/100).toFixed(2).replace(/\.?0+$/,'')} Cr` : `₹${l} Lakh`
const sizeBands = [['Under 2,000 sq ft',0,2000],['2,000 – 5,000',2000,5000],['5,000 – 20,000',5000,20000],['Above 20,000',20000,1e9]]
const budgetBands = [['Under ₹50 Lakh',0,50],['₹50 – 150 Lakh',50,150],['₹1.5 – 5 Cr',150,500],['Above ₹5 Cr',500,1e9]]

const coords={1:[12.9698,77.7500],2:[13.2473,77.7129],3:[29.4727,79.6476],4:[30.1337,78.3157],5:[18.7546,73.4062],6:[18.5912,73.7389],7:[18.6414,72.8722],8:[28.4350,77.4930],9:[28.4089,77.0420],10:[26.8467,75.8010],11:[26.4897,74.5511],12:[12.3500,76.6200],13:[29.0700,77.7100]}
properties.forEach(p=>{[p.lat,p.lng]=coords[p.id]})
const mapUrl=p=>`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`
const dirUrl=p=>`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`

// Generated landscape artwork. To use real photos, add an `img` URL to a property and use <img> instead.
const Photo = ({ hue, id, big }) => (
  <svg className="photo" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id={`s${id}${big?'b':''}`} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor={`hsl(${hue},35%,78%)`}/><stop offset="1" stopColor="#f3e9d6"/></linearGradient></defs>
    <rect width="400" height="260" fill={`url(#s${id}${big?'b':''})`}/>
    <circle cx={90 + (id % 5) * 50} cy="70" r="22" fill="#fff" opacity=".7"/>
    <path d={`M0 170 Q100 ${110 + (id % 4) * 15} 210 150 T400 ${140 + (id % 3) * 10} V260 H0Z`} fill={`hsl(${hue},22%,42%)`}/>
    <path d="M0 205 Q150 165 400 200 V260 H0Z" fill={`hsl(${hue},28%,28%)`}/>
  </svg>)

const Card = ({ p, go }) => (
  <article className="card" onClick={() => go(`/land/${p.id}`)} tabIndex="0" onKeyDown={e => e.key === 'Enter' && go(`/land/${p.id}`)}>
    <div className="thumb"><Photo hue={p.hue} id={p.id}/><span className={`tag ${p.avail === 'Sold' ? 'sold' : ''}`}>{p.avail}</span></div>
    <div className="card-body">
      <h3>{p.title}</h3>
      <p className="muted">{p.area}, {p.city}, {p.state}</p>
      <div className="row"><strong>{fmtPrice(p.price)}</strong><span className="muted">{p.sqft.toLocaleString('en-IN')} sq ft · {p.type}</span></div>
      <a className="loc-btn" href={mapUrl(p)} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}>📍 View Location</a>
    </div>
  </article>)

const Sel = ({ label, value, onChange, children }) => (
  <label className="field">{label}<select value={value} onChange={e => onChange(e.target.value)}>{children}</select></label>)

const Filters = ({ f, set, show = ['state','city','size','type','budget','avail'] }) => {
  const states = [...new Set(properties.map(p => p.state))]
  const cities = [...new Set(properties.filter(p => !f.state || p.state === f.state).map(p => p.city))]
  const types = [...new Set(properties.map(p => p.type))]
  const all = t => <option value="">{t}</option>
  return (<div className="filters">
    {show.includes('state') && <Sel label="State" value={f.state} onChange={v => set({ ...f, state: v, city: '' })}>{all('All states')}{states.map(s => <option key={s}>{s}</option>)}</Sel>}
    {show.includes('city') && <Sel label="City / Area" value={f.city} onChange={v => set({ ...f, city: v })}>{all('All cities')}{cities.map(s => <option key={s}>{s}</option>)}</Sel>}
    {show.includes('size') && <Sel label="Land size" value={f.size} onChange={v => set({ ...f, size: v })}>{all('Any size')}{sizeBands.map((b, i) => <option key={i} value={i}>{b[0]}</option>)}</Sel>}
    {show.includes('type') && <Sel label="Property type" value={f.type} onChange={v => set({ ...f, type: v })}>{all('Any type')}{types.map(s => <option key={s}>{s}</option>)}</Sel>}
    {show.includes('budget') && <Sel label="Budget" value={f.budget} onChange={v => set({ ...f, budget: v })}>{all('Any budget')}{budgetBands.map((b, i) => <option key={i} value={i}>{b[0]}</option>)}</Sel>}
    {show.includes('avail') && <Sel label="Availability" value={f.avail} onChange={v => set({ ...f, avail: v })}>{all('Any')}<option>Available</option><option>Under Negotiation</option><option>Sold</option></Sel>}
  </div>)
}

const InterestForm = ({ p }) => {
  const [done, setDone] = useState(false)
  if (done) return <div className="notice">Thanks! {p ? p.owner : 'Our team'} will contact you soon. (Demo – nothing was sent.)</div>
  return (<form className="form" onSubmit={e => { e.preventDefault(); setDone(true) }}>
    <input required placeholder="Full name"/><input required type="email" placeholder="Email"/>
    <input required type="tel" placeholder="Phone"/><textarea rows="3" placeholder="Message"/>
    <button className="btn gold">I'm Interested</button></form>)
}

const empty = { state: '', city: '', size: '', type: '', budget: '', avail: '', sort: 'newest' }
const useRoute = () => {
  const [r, setR] = useState(location.hash.slice(1) || 'home')
  useEffect(() => { const h = () => { setR(location.hash.slice(1) || 'home'); window.scrollTo(0, 0) }; addEventListener('hashchange', h); return () => removeEventListener('hashchange', h) }, [])
  return [r, p => (location.hash = p.replace(/^\//,'').replace('/','-'))]
}

function Home({ f, set, go }) {
  const stats = [[properties.length, 'Properties listed'], [new Set(properties.map(p => p.state)).size, 'States covered'], [new Set(properties.map(p => p.city)).size, 'Cities'], ['4', 'Property types']]
  return (<>
    <section className="hero"><div className="wrap">
      <h1>Find the Right Land.<br/>In the Right Place.</h1>
      <p>Search plots, farms and commercial land across India, with the road, Vastu and history details up front.</p>
      <div className="search"><Filters f={f} set={set} show={['state','city','size','type']}/><button className="btn gold" onClick={() => go('/explore')}>Search lands</button></div>
    </div></section>
    <section className="wrap sec"><h2>Featured lands</h2>
      <div className="grid">{properties.filter(p => p.avail === 'Available').slice(0, 6).map(p => <Card key={p.id} p={p} go={go}/>)}</div></section>
    <section className="band"><div className="wrap stats">{stats.map(([n, l]) => <div key={l}><b>{n}</b><span>{l}</span></div>)}</div></section>
    <section className="wrap sec"><h2>How LandLens works</h2><Steps/></section></>)
}

const Steps = () => (<div className="steps">{[['Search','Pick a state, city, size and type.'],['Filter','Narrow by budget and availability.'],['Compare','Open listings side by side in tabs.'],['View details','Read road access, Vastu and history.'],['Contact','Message or WhatsApp the owner or broker.']].map(([t, d], i) =>
  <div key={t} className="step"><span>{i + 1}</span><h4>{t}</h4><p className="muted">{d}</p></div>)}</div>)

function Explore({ f, set, go }) {
  const list = properties.filter(p => (!f.state || p.state === f.state) && (!f.city || p.city === f.city) && (!f.type || p.type === f.type) && (!f.avail || p.avail === f.avail) &&
    (f.size === '' || (p.sqft >= sizeBands[f.size][1] && p.sqft < sizeBands[f.size][2])) &&
    (f.budget === '' || (p.price >= budgetBands[f.budget][1] && p.price < budgetBands[f.budget][2])))
    .sort((a, b) => f.sort === 'price-asc' ? a.price - b.price : f.sort === 'price-desc' ? b.price - a.price : f.sort === 'size' ? b.sqft - a.sqft : b.year - a.year || b.id - a.id)
  return (<div className="wrap sec"><h1>Explore lands</h1>
    <Filters f={f} set={set}/>
    <div className="bar"><span className="muted">{list.length} properties found</span>
      <div><button className="link" onClick={() => set(empty)}>Clear filters</button>
        <select value={f.sort} onChange={e => set({ ...f, sort: e.target.value })}><option value="newest">Newest</option><option value="size">Largest size</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div></div>
    {list.length ? <div className="grid">{list.map(p => <Card key={p.id} p={p} go={go}/>)}</div> : <div className="notice">No lands match these filters. Try clearing one.</div>}</div>)
}

function Detail({ id, go }) {
  const p = properties.find(x => x.id === +id)
  const [open, setOpen] = useState(false)
  if (!p) return <div className="wrap sec">Property not found.</div>
  const info = [['Location', `${p.area}, ${p.city}, ${p.state}`], ['Total area', `${p.sqft.toLocaleString('en-IN')} sq ft`], ['Dimensions', p.dims], ['Property type', p.type], ['Availability', p.avail], ['Road / access', p.road], ['Vastu notes', p.vastu]]
  return (<div className="wrap sec"><button className="link" onClick={() => go('/explore')}>‹ Back to lands</button>
    <div className="gallery"><div><Photo hue={p.hue} id={p.id} big/></div><div><Photo hue={(p.hue + 30) % 360} id={p.id + 3} big/></div><div><Photo hue={(p.hue + 60) % 360} id={p.id + 7} big/></div></div>
    <div className="detail"><div>
      <h1>{p.title}</h1><p className="muted">{p.area}, {p.city}, {p.state}</p><p>{p.desc}</p>
      <dl>{info.map(([k, v]) => <div key={k}><dt>{k}</dt><dd>{v}</dd></div>)}</dl>
      <h3>Background</h3><p>{p.history}</p>
      <h3>Location</h3><div className="mapbox"><div><b>{p.area}, {p.city}</b><p className="muted">Demo coordinates: {p.lat.toFixed(4)}° N, {p.lng.toFixed(4)}° E</p></div><div className="mapbtns"><a className="btn dark sm" href={mapUrl(p)} target="_blank" rel="noreferrer">📍 View Location</a><a className="btn sm line" href={dirUrl(p)} target="_blank" rel="noreferrer">Get directions</a></div></div>
      <h3>Nearby landmarks</h3><ul>{p.landmarks.map(l => <li key={l}>{l}</li>)}</ul></div>
      <aside className="side"><div className="price">{fmtPrice(p.price)}</div>
        <p className="muted">Listed by {p.owner}</p>
        <a className="btn dark" href={`tel:${p.phone.replace(/\s/g, '')}`}>Contact Owner · {p.phone}</a>
        <a className="btn wa" href={`https://wa.me/${p.phone.replace(/\D/g, '')}?text=Hi, I'm interested in ${p.title} on LandLens`} target="_blank" rel="noreferrer">WhatsApp</a>
        <a className="btn line" href={mapUrl(p)} target="_blank" rel="noreferrer">📍 View Location</a>
        <button className="btn gold" onClick={() => setOpen(!open)}>Interested in this Land</button>
        {open && <InterestForm p={p}/>}</aside></div></div>)
}

function Locations({ set, go }) {
  const tree = {}
  properties.forEach(p => { ((tree[p.state] ??= {})[p.city] ??= {})[p.area] = (tree[p.state][p.city][p.area] || 0) + 1 })
  const count = o => Object.values(o).reduce((s, v) => s + (typeof v === 'number' ? v : count(v)), 0)
  return (<div className="wrap sec"><h1>Browse by location</h1><p className="muted">India → State → City → Area</p>
    <div className="loc">{Object.entries(tree).map(([s, cs]) => <div key={s} className="locbox"><h3>{s} <small>{count(cs)} lands</small></h3>
      {Object.entries(cs).map(([c, as]) => <div key={c}><b>{c}</b> <small>{count(as)}</small>
        <div className="chips">{Object.entries(as).map(([a, n]) => <button key={a} className="chip" onClick={() => { set({ ...empty, state: s, city: c }); go('/explore') }}>{a} ({n})</button>)}</div></div>)}</div>)}</div></div>)
}

const Page = ({ title, children }) => <div className="wrap sec narrow"><h1>{title}</h1>{children}</div>

function List() {
  const [done, setDone] = useState(false)
  return (<Page title="List your land"><p className="muted">Share basic details and our team will reach out. This is a demo form, nothing is saved.</p>
    {done ? <div className="notice">Thanks! Your land has been noted for review.</div> :
    <form className="form" onSubmit={e => { e.preventDefault(); setDone(true) }}>
      <input required placeholder="Your name"/><input required type="tel" placeholder="Phone"/>
      <input required placeholder="State"/><input required placeholder="City / Area"/>
      <input required placeholder="Land size (sq ft)"/><input placeholder="Expected price (₹)"/>
      <select><option>Residential</option><option>Commercial</option><option>Farmland</option><option>Hill / Eco-stay</option></select>
      <textarea rows="4" placeholder="Describe the land, road access and Vastu"/><button className="btn gold">Submit listing</button></form>}</Page>)
}

function App() {
  const [route, go] = useRoute()
  const [f, set] = useState(empty)
  const [menu, setMenu] = useState(false)
  const links = [['/', 'Home'], ['/explore', 'Explore'], ['/locations', 'Locations'], ['/how', 'How it works'], ['/about', 'About']]
  const [path, id] = route.split('-')
  let page
  if (route === 'home') page = <Home f={f} set={set} go={go}/>
  else if (path === 'explore') page = <Explore f={f} set={set} go={go}/>
  else if (path === 'land') page = <Detail id={id} go={go}/>
  else if (path === 'locations') page = <Locations set={set} go={go}/>
  else if (path === 'how') page = <Page title="How it works"><Steps/></Page>
  else if (path === 'list') page = <List/>
  else page = <Page title="About LandLens"><p>LandLens helps people discover land across India with clear details on size, access, Vastu and background, so the right plot is easier to find.</p>
    <p className="muted">LandLens is a college project built for HSMC as a demo. All properties, owners, prices and phone numbers are fictional.</p></Page>
  return (<>
    <header className="nav"><div className="wrap navin"><a href="#home" className="logo">LandLens</a>
      <button className="burger" onClick={() => setMenu(!menu)} aria-label="Menu">☰</button>
      <nav className={menu ? 'open' : ''} onClick={() => setMenu(false)}>{links.map(([h, t]) => <a key={h} href={`#${h.replace(/^\//,'') || 'home'}`}>{t}</a>)}<a className="btn gold sm" href="#list">List your land</a></nav></div></header>
    <main>{page}</main>
    <footer><div className="wrap">LandLens · HSMC college demo project · Sample data only</div></footer></>)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script></body></html>
